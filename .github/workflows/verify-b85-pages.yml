name: B85 Pages browser policy exact-parity and UI E2E
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python browser regression before costly installation
        run: |
          python -m py_compile tests/browser_e2e.py tests/test_pages_bridge.py
          node --check static/dashboard.js
          node --check static/cpi-official.js
          echo 'B85_E2E_SYNTAX_CHECK_PASS'
      - name: Install model and browser QA dependencies (CI only)
        run: |
          python -m pip install 'numpy>=1.26,<3' 'playwright==1.55.0'
          python -m playwright install chromium --with-deps
      - name: Verify immutable B+85 engine and all deployed site assets
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('.');manifest=json.loads((p/'SOURCE_SHA256.json').read_text('utf-8'))
          for name,expected in manifest.items():
              got=hashlib.sha256((p/name).read_bytes()).hexdigest()
              if got!=expected:raise RuntimeError(f'ASSET_SHA256_MISMATCH {name}: {got} != {expected}')
          assert manifest['policy/retirement_model_v340.py']=='54dd2718a098c7f8182fcc44db980c523c2859fdaa276c50e81e8f8ea8712f10'
          assert not (p/'user_data/annual_records.json').exists()
          print('PAGES_ALL_'+str(len(manifest))+'_SOURCE_HASHES_PASS; B85_ORIGINAL_POLICY_UNCHANGED')
          PY
          node --check static/app.js
          node --check pyodide-worker.js
          python -m unittest discover -s tests -p 'test_pages_bridge.py' -v
      - name: Serve static Pages bundle locally on GitHub runner
        run: |
          nohup python -m http.server 8766 --bind 127.0.0.1 >/tmp/pages-server.log 2>&1 &
          sleep 2
      - name: Use actual Pyodide in headless Chromium (not a mock)
        run: python tests/browser_e2e.py
      - name: Preserve diagnostic screenshot if browser fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b85-pages-browser-failure-${{ github.run_id }}
          path: /tmp/b85_pages_browser_failure.png
          if-no-files-found: ignore
          retention-days: 7
# No repository CPI / ACTIVE modifications; browser-only research execution.
